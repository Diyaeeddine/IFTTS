<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Convergence&family=Lato:wght@300;400;700;900&family=Mukta:wght@300;400;600;700;800&family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --clr-primary: #18ffff;
            --clr-primary-light: #adffff;
            --clr-primary-dark: #091034;
            --clr-gray100: #f9fbff;
            --clr-gray150: #f4f6fb;
            --clr-gray200: #eef1f6;
            --clr-gray300: #e1e5ee;
            --clr-gray400: #767b91;
            --clr-gray500: #4f546c;
            --clr-gray600: #2a324b;
            --clr-gray700: #161d34;
            --clr-bg: #060b23;
            --radius: 0.5rem;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Convergence", sans-serif;
            height: 100vh;
            display: grid;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            background-color: var(--clr-bg);
        }

        .mb-3 {
            position: relative;
            width: 20rem;
            height: 3rem;
        }

        .form-control {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 2px solid var(--clr-gray300);
            border-radius: var(--radius);
            font-family: inherit;
            font-size: inherit;
            color: white;
            outline: none;
            padding: 1.25rem;
            background: none;
        }

        .form-control:hover {
            border-color: var(--clr-primary-light);
        }

        .form-control:focus {
            border-color: var(--clr-primary);
        }

        .form-label {
            position: absolute;
            left: 1rem;
            top: 0.8rem;
            padding: 0 0.5rem;
            color: white;
            cursor: text;
            transition: top 200ms ease-in, left 200ms ease-in, font-size 200ms ease-in;
            background-color: var(--clr-bg);
        }

        .form-control:focus ~ .form-label,
        .form-control:not(:placeholder-shown).form-control:not(:focus) ~ .form-label {
            top: -0.5rem;
            font-size: 0.8rem;
            left: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="mb-3">
        <input type="text" id="email" class="form-control" autocomplete="off" placeholder=" ">
        <label for="email" class="form-label">Email</label>
    </div>

        <input type="text" id="CIN" name="CIN" class="form-control" autocomplete="off" placeholder="" required>
        <label for="CIN" class="form-label">CIN</label>
    </div> -->
    <div class="mb-3">
        <input type="text" id="CIN" name="CIN" class="form-control" autocomplete="off" placeholder="" required>
        <label for="CIN" class="form-label">CIN :</label>
    </div>
</body>
</html>
